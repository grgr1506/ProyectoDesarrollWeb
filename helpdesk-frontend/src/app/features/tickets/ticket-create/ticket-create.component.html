<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex align-items-center mb-4 gap-3">
      <a routerLink="/tickets" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h4 class="fw-bold mb-0" style="color:#1F4E79">
        <i class="bi bi-plus-circle me-2"></i>Nuevo Ticket de Incidencia
      </h4>
    </div>

    <div class="card p-4">
      <div *ngIf="error" class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      </div>

      <div class="alert alert-info py-2 small">
        <i class="bi bi-info-circle me-2"></i>
        Los tickets de categoría <strong>Fallas de Red</strong> o <strong>Caída de Servicios</strong>
        recibirán prioridad <strong>ALTA</strong> automáticamente.
      </div>

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="titulo" name="titulo"
                 placeholder="Describe brevemente el problema" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Categoría <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="categoriaId" name="categoriaId" required>
            <option [ngValue]="null" disabled>Selecciona una categoría...</option>
            <option *ngFor="let c of categorias" [ngValue]="c.id">
              {{ c.nombre }} <span *ngIf="c.requiereValidacionProveedor">⚠️</span>
            </option>
          </select>
          <div class="form-text">⚠️ = Requiere documentar solución al cerrar</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Descripción detallada <span class="text-danger">*</span></label>
          <textarea class="form-control" [(ngModel)]="descripcion" name="descripcion" rows="5"
                    placeholder="Describe el problema con detalle: cuándo ocurrió, equipos afectados, mensajes de error..." required></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            <i *ngIf="!loading" class="bi bi-send me-2"></i>
            Enviar Ticket
          </button>
          <a routerLink="/tickets" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
