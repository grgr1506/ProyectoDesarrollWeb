<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0" style="color:#1F4E79"><i class="bi bi-tags me-2"></i>Categorías</h4>
  <button class="btn btn-primary" (click)="openNew()">
    <i class="bi bi-plus-circle me-2"></i>Nueva Categoría
  </button>
</div>

<div *ngIf="successMsg" class="alert alert-success py-2 alert-dismissible">
  <i class="bi bi-check-circle me-2"></i>{{ successMsg }}
  <button type="button" class="btn-close" (click)="successMsg=''"></button>
</div>
<div *ngIf="error" class="alert alert-danger py-2 alert-dismissible">
  <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
  <button type="button" class="btn-close" (click)="error=''"></button>
</div>

<!-- Formulario modal-like -->
<div *ngIf="showForm" class="card p-4 mb-4 border-primary border-start border-4">
  <h6 class="fw-semibold mb-3">{{ editando ? 'Editar Categoría' : 'Nueva Categoría' }}</h6>
  <form (ngSubmit)="save()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="form.nombre" name="nombre" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Descripción</label>
        <input type="text" class="form-control" [(ngModel)]="form.descripcion" name="descripcion">
      </div>
      <div class="col-12">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" [(ngModel)]="form.requiereValidacionProveedor"
                 name="req" id="req">
          <label class="form-check-label" for="req">
            Requiere documentar solución al cerrar (RN02)
          </label>
        </div>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-floppy me-2"></i>Guardar
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="showForm=false">Cancelar</button>
      </div>
    </div>
  </form>
</div>

<div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

<div *ngIf="!loading" class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead>
        <tr><th>Nombre</th><th>Descripción</th><th>RN02</th><th>Tickets</th><th></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of categorias">
          <td class="fw-semibold">{{ c.nombre }}</td>
          <td class="text-muted small">{{ c.descripcion || '—' }}</td>
          <td>
            <span *ngIf="c.requiereValidacionProveedor" class="badge bg-warning text-dark">
              <i class="bi bi-shield-check me-1"></i>Sí
            </span>
            <span *ngIf="!c.requiereValidacionProveedor" class="badge bg-light text-muted border">No</span>
          </td>
          <td class="text-muted small">—</td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-outline-secondary" (click)="openEdit(c)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="eliminar(c)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="categorias.length === 0">
          <td colspan="5" class="text-center text-muted py-4">No hay categorías</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
