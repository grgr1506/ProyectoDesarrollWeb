<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0" style="color:#1F4E79"><i class="bi bi-people me-2"></i>Usuarios del Sistema</h4>
  <span class="badge bg-secondary">{{ usuarios.length }} registrados</span>
</div>

<div *ngIf="successMsg" class="alert alert-success py-2 alert-dismissible">
  <i class="bi bi-check-circle me-2"></i>{{ successMsg }}
  <button type="button" class="btn-close" (click)="successMsg=''"></button>
</div>
<div *ngIf="error" class="alert alert-danger py-2 alert-dismissible">
  <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
  <button type="button" class="btn-close" (click)="error=''"></button>
</div>

<div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

<div *ngIf="!loading" class="card">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead>
        <tr><th>#</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios">
          <td class="text-muted small">{{ u.id }}</td>
          <td class="fw-semibold">
            <i class="bi bi-person-circle me-2 text-muted"></i>{{ u.nombre }}
          </td>
          <td class="text-muted small">{{ u.correo }}</td>
          <td>
            <span class="badge" [ngClass]="rolClass(u.rol)">{{ rolLabel(u.rol) }}</span>
          </td>
          <td>
            <span class="badge" [ngClass]="u.activo ? 'bg-success' : 'bg-secondary'">
              {{ u.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminar(u)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="usuarios.length === 0">
          <td colspan="6" class="text-center text-muted py-4">No hay usuarios</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
