<div class="login-card">
  <div class="card p-4 shadow">
    <div class="text-center mb-4">
      <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
           style="width:64px;height:64px;background-color:#1F4E79!important">
        <i class="bi bi-person-plus text-white fs-2"></i>
      </div>
      <h4 class="fw-bold" style="color:#1F4E79">Crear Cuenta</h4>
    </div>

    <div *ngIf="error"   class="alert alert-danger  py-2"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
    <div *ngIf="success" class="alert alert-success py-2"><i class="bi bi-check-circle me-2"></i>{{ success }}</div>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre completo</label>
        <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" placeholder="Juan Pérez" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="correo" name="correo" placeholder="juan@empresa.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password"
               placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Rol</label>
        <select class="form-select" [(ngModel)]="rol" name="rol">
          <option value="USUARIO_FINAL">Usuario Final</option>
          <option value="SOPORTE_TI">Soporte TI</option>
          <option value="SUPERVISOR_TI">Supervisor TI</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Registrarme
      </button>
    </form>
    <hr>
    <p class="text-center text-muted small mb-0">
      ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
    </p>
  </div>
</div>
