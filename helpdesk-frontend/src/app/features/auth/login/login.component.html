<div class="login-card">
  <div class="card p-4 shadow">
    <div class="text-center mb-4">
      <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
           style="width:64px;height:64px;background-color:#1F4E79!important">
        <i class="bi bi-headset text-white fs-2"></i>
      </div>
      <h4 class="fw-bold" style="color:#1F4E79">Helpdesk TI</h4>
      <p class="text-muted small">Sistema de Gestión de Incidencias</p>
    </div>

    <div *ngIf="error" class="alert alert-danger py-2">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
    </div>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" [(ngModel)]="correo" name="correo"
                 placeholder="usuario@empresa.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" [(ngModel)]="password" name="password"
                 placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!loading" class="bi bi-box-arrow-in-right me-2"></i>
        Iniciar Sesión
      </button>
    </form>

    <hr>
    <p class="text-center text-muted small mb-0">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</div>
